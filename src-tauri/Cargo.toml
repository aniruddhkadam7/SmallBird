[package]
name = "desktop"
version = "0.1.33"
description = "Smallbird — AI interview copilot"
authors = ["you"]
edition = "2021"
default-run = "desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.24.0"
crossbeam-channel = "0.5.16"
log = "0.4.33"
env_logger = "0.11.11"
rubato = "0.15"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "blocking", "multipart", "stream", "rustls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Media_Audio",
    "Media_Core",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Foundation",
] }
sysinfo = "0.32"
tauri-plugin-global-shortcut = "2.3.2"
keyring = { version = "3", features = ["windows-native"] }
# Declared directly (not just relied on transitively) so
# `rustls::crypto::ring::default_provider().install_default()` can be called
# explicitly at process start — see src/tls_init.rs for why this is needed
# by every HTTPS reqwest::Client in this crate, including the direct AI
# provider calls in src/personal/providers/.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# In-process resume/CV and job-description text extraction (see
# src/documents.rs) — replaces the old rag-lite Python sidecar entirely, so
# document upload no longer depends on an external process/binary being
# present.
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
# "sync"/"macros" added for stt::client's Deepgram WebSocket task (tokio::sync
# mpsc/oneshot channels bridging the sync pipeline thread to the async
# connection task, and tokio::select! in its read/write pump).
tokio = { version = "1", features = ["time", "sync", "macros"] }
# Deepgram Flux streaming client (see src/stt/client.rs). Reuses the rustls
# "ring" crypto provider already installed process-wide at startup (see
# tls_init.rs) rather than pulling in a second TLS stack.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
xcap = "0.9.8"
# Same `image` crate xcap already uses (0.25) — listed only to switch on its
# JPEG encoder, so overlay screenshots upload ~10x smaller than PNG.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.23.1"
sha2 = "0.10"
getrandom = "0.2"
tauri-plugin-log = "2"

